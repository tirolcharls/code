<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FOTO | Forgot Password</title>
  <!-- ALL design comes from style.css -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== FORGOT PASSWORD CARD ===== -->
  <main class="login-card">

    <!-- Title -->
    <h1 class="brand-title">FOTO</h1>
    <p class="brand-subtitle">Capture Every Moment</p>

    <!-- Heading -->
    <h2 class="page-heading">Forgot Password</h2>

    <!-- PHP: put your reset file name in action="" (example: send-reset.php) -->
    <form class="page-form" action="" method="POST">

      <!-- Email address -->
      <div class="input-box">
        <input type="email" name="email" placeholder="Email address" required>
      </div>

      <!-- Send button -->
      <button type="submit" class="btn-blue">Send Reset Link</button>

      <!-- Back to login (goes to index.html) -->
      <a class="back-link" href="index.html">&larr; Back to Login</a>
    </form>

  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="page-footer">
    FOTO • Capture Every Moment • College Departmental Photo Gallery<br>
    © 2026 FOTO. All rights reserved.
  </footer>

</body>
</html>
